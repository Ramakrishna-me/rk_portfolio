<nav class="navbar navbar-expand-lg glass-nav fixed-top">
    <div class="container-fluid px-2">

        <!-- BRAND -->
        <a class="navbar-brand d-flex align-items-center" routerLink="/"
            (click)="closeMobileNav()">
            <img src="assets/logo12-01.png" class="brand-logo" alt="logo">
        </a>

        <!-- TOGGLER -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- NAV LINKS -->
        <div class="collapse navbar-collapse" id="navMenu">

            <ul class="navbar-nav mx-auto text-center">

                <li class="nav-item">
                    <a class="nav-link"
                        routerLink="/"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact:true}"
                        (click)="closeMobileNav()">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                        routerLink="/about"
                        routerLinkActive="active"
                        (click)="closeMobileNav()">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                        routerLink="/work"
                        routerLinkActive="active"
                        (click)="closeMobileNav()">
                        Work
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                        routerLink="/contact"
                        routerLinkActive="active"
                        (click)="closeMobileNav()">
                        Contact
                    </a>
                </li>

            </ul>

            <!-- SOCIAL ICONS -->
            <div class="icon-section d-flex align-items-center gap-2">

                <div class="icon-item"
                    (click)="openGithub(); closeMobileNav()">
                    <img src="assets/Icons/github.png" />
                </div>

                <div class="icon-item"
                    (click)="openInstagram(); closeMobileNav()">
                    <img src="assets/Icons/instagram.png" />
                </div>

                <div class="icon-item"
                    (click)="openLinkedin(); closeMobileNav()">
                    <img src="assets/Icons/linkedin.png" />
                </div>

            </div>

        </div>

    </div>
</nav>
